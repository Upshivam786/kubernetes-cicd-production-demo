name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/upshivam786/kubernetes-cicd-production-demo

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          DB_PASSWORD: test-password
        run: |
          pytest -q

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Update backend image
        run: |
          kubectl -n fluid-ai set image deployment/backend \
            backend=${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl -n fluid-ai rollout status deployment/backend --timeout=180s

      - name: Verify deployed image
        run: |
          DEPLOYED_IMAGE=$(kubectl -n fluid-ai get deployment backend \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          EXPECTED_IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "Expected image: ${EXPECTED_IMAGE}"
          echo "Deployed image: ${DEPLOYED_IMAGE}"

          if [ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: deployed image does not match expected image"
            exit 1
          fi

      - name: Verify backend pods
        run: |
          kubectl -n fluid-ai get pods -l app=backend
          kubectl -n fluid-ai get deployment backend

      - name: Smoke test
        run: |
          set -e

          kubectl -n fluid-ai port-forward service/backend 18000:8000 \
            > /tmp/backend-port-forward.log 2>&1 &

          PF_PID=$!

          cleanup() {
            kill "$PF_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for backend service..."

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18000/healthz > /tmp/healthz.json; then
              echo "Backend is responding."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "ERROR: backend did not become available"
              cat /tmp/backend-port-forward.log
              exit 1
            fi

            sleep 2
          done

          echo "Testing /healthz..."
          curl -fsS http://127.0.0.1:18000/healthz
          echo

          echo "Testing /readyz..."
          curl -fsS http://127.0.0.1:18000/readyz
          echo

          echo "Testing /items..."
          curl -fsS http://127.0.0.1:18000/items
          echo

          echo "Smoke tests passed."

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment verification failed."
          echo "Rolling back backend deployment..."

          kubectl -n fluid-ai rollout undo deployment/backend

          kubectl -n fluid-ai rollout status deployment/backend --timeout=180s

          echo "Rollback completed."
